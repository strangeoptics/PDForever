spring:
  application:
    name: pdforever
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:./data/pdforever.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA journal_mode=WAL; PRAGMA foreign_keys=ON; PRAGMA busy_timeout=5000;
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080

library:
  root-dir: ./storage
  lucene-dir: ./data/lucene-index
  covers-dir: ./data/covers
  debounce-ms: 2000
  watcher-enabled: true
  clean-remove-literals:
    - "_de.downmagaz.net"
    - "de.downmagaz.net"
    - "downmagaz.net"
  clean-remove-regexes:
    - "(?<=\\b(?:18|19|20)\\d{2})\\s*--.*$"
  rag:
    ollama-url: http://127.0.0.1:11434
    max-passages: 12
  ad-removal:
    ollama-url: http://127.0.0.1:11434
    model: qwen2.5vl
    min-confidence: 0.75
    dpi: 140
    dry-run: true

